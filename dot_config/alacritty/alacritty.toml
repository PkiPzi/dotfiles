# One Dark, ported from the old alacritty.yml

[general]
live_config_reload = true

[window]
padding = { x = 6, y = 6 }
dynamic_padding = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[font]
size = 12
normal = { family = "FiraCode Nerd Font", style = "Regular" }

[colors.primary]
background = "#1e2127"
foreground = "#abb2bf"

[colors.normal]
black   = "#1e2127"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#d19a66"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#abb2bf"

[colors.bright]
black   = "#5c6370"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#d19a66"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#dcdfe4"

[keyboard]
bindings = [
  # new terminal in the same directory
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
]
