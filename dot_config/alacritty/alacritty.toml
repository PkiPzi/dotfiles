[general]
live_config_reload = true
# symlink to rices/<name>.toml, managed by ~/.local/bin/rice
import = ["~/.config/alacritty/rice.toml"]

[terminal]
# explicit, so a session started before `chsh` still gets zsh
shell = "/usr/bin/zsh"

[window]
dynamic_padding = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[keyboard]
bindings = [
  # new terminal in the same directory
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
]
