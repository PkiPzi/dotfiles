# solstice: the same glass as the top bar pills (Catppuccin base at 72% over KWin's frosted
# blur), JetBrains Mono with a little extra line height.
[general]
import = ["~/.config/alacritty/themes/catppuccin.toml"]

[window]
opacity = 0.72
blur = true
padding = { x = 12, y = 10 }

[font]
size = 11
offset = { x = 0, y = 2 }
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[colors.cursor]
text = "#1e1e2e"
cursor = "#b4befe"
